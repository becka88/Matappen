name: Uppdatera recept

on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Hämta repot
        uses: actions/checkout@v4

      - name: Starta Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installera receptverktyg
        run: pip install -r scripts/requirements.txt

      - name: Hämta nya recept
        run: python scripts/update_recipes.py

      - name: Spara nya recept
        run: |
          git config user.name "Matappen Bot"
          git config user.email "actions@users.noreply.github.com"
          git add recipes.json
          git diff --cached --quiet || git commit -m "Uppdatera receptkatalog"
          git push
