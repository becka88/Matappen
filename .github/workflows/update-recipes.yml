name: Uppdatera Matappen

on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Hämta repot
        uses: actions/checkout@v4

      - name: Starta Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installera verktyg
        run: pip install -r scripts/requirements.txt

      - name: Hämta nya recept
        run: python scripts/update_recipes.py

      - name: Hämta ICA-erbjudanden för Maxi Växjö
        run: python scripts/update_offers.py

      - name: Hämta riktiga onlinepriser från Maxi ICA Växjö
        run: python scripts/update_prices.py

      - name: Spara recept, erbjudanden och priser
        run: |
          git config user.name "Matappen Bot"
          git config user.email "actions@users.noreply.github.com"
          git add recipes.json offers.json prices.json
          git diff --cached --quiet || git commit -m "Uppdatera recept, ICA-erbjudanden och priser"
          git push
